name: macOS candidate
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run test:distribution
      - run: npm run format:check
      - run: npm run test:core
      - run: npm run test:platform
      - run: npm run test:linux
      - run: npm run build:mac
      - name: Test isolated Keychain entry
        run: node scripts/macos/native-test.mjs
      - run: node scripts/macos/runner-test.mjs
      - name: Setup managed Mac dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/n3zuui-test-workspace"
          export DWB_DATA_DIR="$RUNNER_TEMP/n3zuui-mac-data"
          echo "DWB_DATA_DIR=$DWB_DATA_DIR" >> "$GITHUB_ENV"
          node scripts/macos/preview.mjs setup --workspace "$RUNNER_TEMP/n3zuui-test-workspace"
      - run: npm run test:mac
      - run: npm run release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-source-${{ matrix.os }}
          path: |
            releases/*-macos-source.zip
            releases/*-macos-source.zip.sha256
